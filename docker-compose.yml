services:
  backend:
    build: ./backend
    container_name: dolma-backend
    ports:
      - "5050:5000"
    env_file:
      - ./backend/.env
    volumes:
      - ./backend:/app
    environment:
      - FLASK_ENV=development
      - FLASK_APP=app.py
      # Listens on 5000 inside the container, but the browser reaches it on 5050,
      # so the Google OAuth redirect must point at the host-side port.
      - PORT=5000
      - PUBLIC_PORT=5050
      - FRONTEND_URL=http://localhost:5173
    command: flask run --host=0.0.0.0 --port=5000 --reload
    restart: always

  frontend:
    build: ./frontend
    container_name: dolma-frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      # 👇 point to host-accessible backend
      - VITE_API_BASE=http://localhost:5050
    depends_on:
      - backend
    restart: always
